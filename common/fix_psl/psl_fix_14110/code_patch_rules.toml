# line_hint:
#   original file line number to anchor the patch.
# search_window:
#   allowed drift from line_hint before the script aborts for safety.
#
# operation = "disable_block"
#   Wrap the matched block with #if 0 / #endif.
#   The original block stays visible and a patch marker comment is added.
#
# operation = "replace_line"
#   Replace one exact line and leave the patch marker in the replacement text.

